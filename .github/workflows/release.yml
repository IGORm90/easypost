name: Release

# One workflow, three jobs, two triggers:
#
#   push to main        -> `ci` runs the checks (style, static analysis, backend and frontend
#                          tests, migrations); only if they pass, `images` builds the app and
#                          web images and pushes them to GHCR, tagged with the commit SHA.
#                          Nothing is deployed.
#   manual dispatch     -> `deploy`: ship one commit to the production host over SSH. It
#                          accepts a commit only if its push run above is green.
#
# Building on every push and deploying only on a click is deliberate (DEPLOY.md,
# "Принятые решения"): without a staging environment a broken commit must not reach
# production by merely being merged. A deploy takes no input: it ships the commit the run
# was started on, i.e. the head of the branch picked in the "Run workflow" dialog. Auto-deploy
# can come later, after several manual releases, by adding `workflow_run` here.
# There is no separate ci.yml and no check on pull requests, by decision: work lands on
# main directly. tests/Unit/Architecture/ReleaseWorkflowTest.php pins what follows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The checks that used to be ci.yml, now the first job here: one workflow, one run per push.
  # `images` waits for it, so a red commit never leaves an image in the registry, and a deploy
  # accepts a commit only if this push run of Release is green (see the deploy job below).
  # Inherits the read-only workflow permissions: it runs the repository's own code and
  # must not be able to publish anything.
  ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Tests run against their own database (see phpunit.xml DB_DATABASE),
          # matching the app_test database provisioned locally by
          # docker/postgres/init-test-db.sql — no shared "app" data to protect
          # in CI's ephemeral service container, so it's created directly.
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: app_test
      DB_USERNAME: app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        # -d memory_limit: PHPStan needs more than PHP's 128M default to
        # analyse this codebase and dies with an out-of-memory fatal
        # rather than a finding. Set here (and documented in README) so a
        # contributor running it locally hits the same ceiling CI does.
        run: php -d memory_limit=1G ./vendor/bin/phpstan analyse

      # Before Pest on purpose: public/build is gitignored, and every test that renders
      # the SPA shell (@vite in app.blade.php) throws "Vite manifest not found" without
      # it. A developer's machine always has a build from earlier; a fresh checkout does not.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck frontend (vue-tsc)
        run: npm run typecheck

      - name: Run frontend tests (Vitest)
        run: npx vitest run

      - name: Build frontend assets
        run: npm run build

      - name: Run tests (Pest)
        run: ./vendor/bin/pest

      # Every one of the 25 migrations defines a down(), and until this
      # step nothing ever ran one: the suite uses RefreshDatabase, which
      # is migrate:fresh, and no CI job rolled back. A down() that has
      # never executed is not a rollback path, it is an untested
      # assertion that one exists — and the first time it matters is the
      # worst time to find out. Final review, batch 4.
      - name: Migrations roll back and re-apply
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --step=100 --force
          php artisan migrate --force

  images:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # GHCR refuses upper case in an image name and this owner has some, so
      # `ghcr.io/${{ github.repository }}` would be an invalid reference.
      - name: Name the images
        id: names
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner is amd64, like the VPS. An image built on a developer's Mac is arm64
      # and would not start on the server. The `app` and `web` targets share every stage
      # up to `app`, so the second build is served from the cache of the first.
      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repo }}:${{ github.sha }}
          # Links the package to this repository, which is what lets this repository's
          # own workflow token read it back (the deploy job lends it to the server).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repo }}-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment make a deploy wait for a human (where the
    # plan allows it), and the SSH secrets below live on the environment, so no other job
    # can read them.
    environment: production
    # Never two at once, and never cancelled half way: cancelling in the middle of a
    # migration is how a database is left between two versions.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: read
    # Everything user-controlled or secret reaches the shell as an environment variable,
    # never as `${{ }}` pasted into a script: that is expanded before the shell runs, so
    # a secret would sit in the script text and a crafted `sha` input would be executed.
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate the SHA
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "not a full commit SHA: $SHA" >&2
            exit 1
          fi

      # The commit being deployed, not whatever main is by now, and the whole history,
      # so the next step can ask whether it is on main.
      - name: Check out the commit being deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # Run from a branch, "deploy this SHA" would otherwise accept a commit from an
      # unmerged pull request.
      - name: Require the SHA to be on main
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is not on main; refusing to deploy it" >&2
            exit 1
          fi

      - name: Require a green push run (checks and images) for the SHA
        run: |
          passed="$(gh run list --workflow release.yml --event push --commit "$SHA" --status success --json conclusion --jq length)"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "release.yml has no successful push run (checks + images) for $SHA; refusing to deploy it" >&2
            exit 1
          fi

      # The server's host key is a secret recorded once, from the server itself
      # (`ssh-keyscan` run by hand and pasted into DEPLOY_KNOWN_HOSTS), and is checked
      # strictly here: this key can run commands as the deploy user.
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host production
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          CONFIG

      # This run's token reads the package (it is linked to the repository by the image
      # label) and expires when the job ends, so no long-lived registry credential has
      # to live on the server.
      - name: Log the server in to GHCR with this run's token
        run: |
          # Expanded here on purpose: the actor name is the runner's own, not user input.
          # shellcheck disable=SC2029
          printf '%s' "$GH_TOKEN" | ssh production "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      # The files the stack reads from the host go with the release, from the same commit
      # as the image. Otherwise a deploy starts the new image on the previous
      # compose file and proxy configuration, and rolling the tag back would not bring the
      # old ones back. nginx and php configuration are inside the images and need no shipping.
      - name: Ship the compose file, proxy config and scripts of this commit
        run: |
          rsync -aR \
            docker/compose.production.yaml \
            docker/caddy \
            docker/minio \
            scripts \
            production:/opt/easypost/

      - name: Deploy the release
        run: |
          # $SHA is expanded here on purpose, and is safe to: the first step accepted
          # nothing but 40 hex characters.
          # shellcheck disable=SC2029
          ssh production "/opt/easypost/scripts/deploy.sh $SHA"
