# Shared by every service: without a cap the Docker daemon's json-file driver
# grows without limit once all application logs go to stdout, a disk-fill risk
# on the app host. Capped, not switched to another driver, so `docker logs`
# keeps working. ComposeServicesTest asserts every service uses it.
x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_healthy
    # `/up` goes through nginx, FastCGI and a booted Laravel, so it proves the
    # whole web path, not only that nginx is listening. It is the framework's
    # light route (no database, no Redis) and docker/nginx/default.conf keeps it
    # out of the access log, so probing it every 30s costs nothing.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging
  php:
    build: ./php
    volumes: ["../:/var/www/html", "easypost-logs:/var/www/html/storage/logs"]
    logging: *default-logging
    # php-fpm has no HTTP port to probe, so this checks the master process.
    # `-x` matches the process name exactly; `-f` would also match this
    # healthcheck's own shell.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x php-fpm > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 512m is for the web workers; media processing is the heavy case (an
    # upload can be 100 MB), and two at once can hit this ceiling, in which
    # case Docker kills the whole container, not one request.
    mem_limit: 512m
    restart: unless-stopped
    # `minio-init` (below) is a "condition: service_completed_successfully"
    # dependency, not merely a start-order one -- review finding 2
    # (CRITICAL): every fresh environment (CI, a new machine) started
    # MinIO with no bucket ever created, so the `media` disk's every
    # write failed from the very first upload. php/horizon/scheduler now
    # cannot start until the `media` bucket demonstrably exists.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: ../.env
  horizon:
    build: ./php
    command: php artisan horizon
    user: www-data
    volumes: ["../:/var/www/html", "easypost-logs:/var/www/html/storage/logs"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: ../.env
    logging: *default-logging
    # Exit 0 only while Horizon runs: 1 when it is paused, 2 when no master
    # supervisor exists. A hung or crashed horizon otherwise stays "Up" while
    # nothing publishes.
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    # Horizon finishes the jobs it is running before it exits. Docker's default
    # of 10s would cut a publish mid-flight, and an interrupted publish is how
    # a post gets published twice. Must exceed the slowest supervisor timeout
    # (90s in config/horizon.php); ComposeServicesTest checks it.
    stop_grace_period: 180s
    # Sized for the workers, not copied from a plan: 15 workers idle at about
    # 730 MiB and each may grow to horizon.memory_limit (64 MB) before it is
    # restarted. Raising a supervisor's process count means raising this;
    # ComposeServicesTest fails if it no longer covers every worker.
    mem_limit: 1280m
    restart: unless-stopped
  scheduler:
    build: ./php
    # The heartbeat file is touched only after a run that exited 0, so it goes
    # stale both when the loop dies and when schedule:run keeps failing or
    # hangs (which a plain "is the process alive" check would call healthy).
    command: sh -c "while true; do php artisan schedule:run && touch /tmp/scheduler-heartbeat; sleep 60; done"
    user: www-data
    volumes: ["../:/var/www/html", "easypost-logs:/var/www/html/storage/logs"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: ../.env
    logging: *default-logging
    # Three minutes is three missed ticks. start_period covers the first run.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/scheduler-heartbeat -mmin -3 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 128m
    restart: unless-stopped
  # Samples this host's CPU, memory and disk for Pulse's Servers card. It is
  # the only process that does: web requests, horizon and the scheduler never
  # run the Servers recorder. It writes no application logs, so it does not
  # mount the easypost-logs volume. PULSE_SERVER_NAME is pinned because the
  # default is the container hostname, which changes on every recreate and
  # would leave a stale server on the card each time.
  pulse:
    build: ./php
    command: php artisan pulse:check
    user: www-data
    volumes: ["../:/var/www/html"]
    environment:
      PULSE_SERVER_NAME: ${PULSE_SERVER_NAME:-easypost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../.env
    logging: *default-logging
    # `pulse[:]check`, not `pulse:check`: pgrep -f matches full command lines,
    # and this healthcheck runs as `sh -c "<this line>"`, whose own command
    # line would match an unescaped pattern and report healthy forever. The
    # bracket form does not match its own text. ComposeServicesTest pins it.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'pulse[:]check' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    restart: unless-stopped
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    # `--host` alone binds Vite's dev server to `::` (the IPv6 unspecified
    # address) and laravel-vite-plugin writes that literal into
    # `public/hot`. `curl` tolerates `http://[::]:5173`, but browsers
    # generally refuse to navigate to it, so nothing built on top of the
    # dev server (HMR client, asset URLs) could ever be checked in a real
    # browser. `0.0.0.0` still listens on every interface (needed so the
    # container-external browser can reach it through the mapped port)
    # but is a literal every browser accepts.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["../:/var/www/html"]
    logging: *default-logging
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
  redis:
    image: redis:7-alpine
    # `noeviction`: when memory runs out Redis refuses writes instead of
    # silently dropping queued jobs (allkeys-lru would evict them), and a
    # refused write is a loud error, a dropped job is not. `--appendonly yes`
    # plus the volume is what lets the queue survive a container recreate;
    # without the volume the append-only file would be discarded with it.
    # 200mb sits under the 256m container cap so Redis refuses writes before
    # Docker kills it.
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging
  minio:
    # minio/minio and minio/mc are gone from Docker Hub (pull access denied)
    # and quay.io/minio/* is unauthorized, so this uses the frozen Bitnami
    # legacy build. Its entrypoint already runs `minio server` on 9000/9001,
    # reads MINIO_ROOT_USER/PASSWORD, and keeps data in /bitnami/minio/data.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    # Fresh named volumes are root-owned but the image runs as uid 1001, which
    # fails with "Permission denied" on /bitnami/minio/data/.root_user. Root
    # lets the Bitnami scripts chown the data dir themselves.
    user: "0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/bitnami/minio/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
  # Review finding 2 (CRITICAL): nothing previously created the `media`
  # bucket -- MinIO starting with an empty volume (any fresh environment)
  # meant the feature was 100% broken from the first request, and
  # (before finding 1's fix) broke invisibly: writes were swallowed and
  # reported as success. `minio/mc` is used rather than a healthcheck +
  # curl on the `minio` image itself, since the official minio/minio
  # image does not bundle a shell-reachable HTTP client to probe with --
  # `mc`'s own retry loop against `mc alias set` is what actually proves
  # the server is accepting connections, not merely that its container
  # started. `--ignore-existing` makes this idempotent across restarts
  # with an already-populated volume.
  # `docker/minio/init.sh` + `docker/minio/media-policy.json` (mounted
  # rather than inlined): bucket creation alone is not sufficient for
  # config/filesystems.php's `media` disk `'visibility' => 'public'` to
  # mean anything on MinIO -- MinIO does not honor the per-object ACL
  # header Flysystem's S3 adapter sends on PutObject by default, so
  # without an explicit anonymous policy every MediaResource.url/
  # thumbnail_url this application returns 403s for an unauthenticated
  # browser request even though the object exists (confirmed by
  # construction against the real, torn-down-and-rebuilt stack: `curl
  # -I` against a just-uploaded object returned 403 before a policy
  # existed at all). The policy file grants ONLY `s3:GetObject` on
  # `arn:aws:s3:::media/*` -- deliberately not the coarser `mc anonymous
  # set download`, which grants unauthenticated `s3:ListBucket` on the
  # whole bucket too (also confirmed by construction: `curl
  # ".../media/?list-type=2"` returned a full, unauthenticated object
  # listing spanning every organization's media, unpublished drafts
  # included, under that shortcut). See media-policy.json's own comment
  # for the full reasoning.
  minio-init:
    # Same image as the server: it ships `mc` on PATH, and one pinned image
    # avoids a second legacy repo.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - ./minio/init.sh:/init.sh:ro
      - ./minio/media-policy.json:/minio-policy/media-policy.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    logging: *default-logging
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging
volumes: { pgdata: {}, minio: {}, easypost-logs: {}, redisdata: {} }
