; Pool overrides, loaded after the image's own www.conf and zz-docker.conf.

[www]
; The php container is capped at 512m (docker/compose.production.yaml) and the
; default pool would happily start enough workers to exceed it, at which point
; Docker kills the whole container, not one request. Four is what 512m carries
; with room for an upload, and two clients at once is already unusual here.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Recycle a worker now and then so a slow leak cannot grow without bound.
pm.max_requests = 500

; php-fpm discards a worker's stderr unless asked: a fatal error that never
; reached Laravel's own logger would vanish without a trace.
catch_workers_output = yes
decorate_workers_output = no
