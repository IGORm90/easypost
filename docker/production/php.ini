; Production-only settings, loaded after docker/php/php.ini (99-app.ini), which
; keeps the upload ceilings (100M file / 108M body) that the media tests pin.

; Files never change inside a running container, so never stat them: a new
; release is a new container. Without this every request pays a stat() per
; included file for nothing.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Off for the CLI on purpose. Horizon runs a master, a supervisor per queue and
; the workers as separate CLI processes; each would keep its own copy of the
; compiled scripts and the 512m cap on the horizon container is sized for 4
; workers, not for 8 opcache copies.
opcache.enable_cli=0

; An error page or a response header must never name the stack.
expose_php=Off
display_errors=Off
log_errors=On
