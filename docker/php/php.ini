; Task 27 review finding 3 (Important): aligned with the 100 MB ceiling
; config('media.import_max_bytes')/UploadMediaRequest's `max` rule (and
; nginx's client_max_body_size) already enforce on the from-url and
; direct-upload paths -- previously 20M here silently truncated any
; upload above it before Laravel's own request-size validation ever ran.
; post_max_size is intentionally a little above upload_max_filesize (as
; PHP's own docs recommend) so the rest of a multipart request's fields
; are never squeezed out by the file itself.
upload_max_filesize = 100M
post_max_size = 108M
memory_limit = 256M
max_execution_time = 120
