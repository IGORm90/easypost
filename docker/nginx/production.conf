# Production twin of default.conf; the copy baked into the `web` image
# (docker/production/Dockerfile).
#
# Differences, and only these:
#  - `forwarded_for` in the access log: behind Caddy, `remote_addr` is always
#    Caddy's own address, and the real client only appears in X-Forwarded-For.
#  - `server_tokens off`: no nginx version in the Server header or error pages.
#
# What is deliberately NOT here: `set_real_ip_from` / `real_ip_header`. They
# would make nginx hand php the client's address as REMOTE_ADDR, and then
# Laravel would no longer see Caddy as the proxy it trusts (TRUSTED_PROXIES), so
# it would drop the forwarded https scheme and the per-IP login throttle would
# key on a spoofable header instead of a verified one. The client address is
# Laravel's job, through trustedproxy.php.
#
# The body limit stays 108M: Caddy, nginx and php-fpm must agree, and Laravel's
# own `max` rule (a clean JSON 422) must be the binding constraint, never a
# proxy's opaque 413. See default.conf for the long reasoning.

# LOG_PLAN.md Phase 2 — requirement 3 (HTTP RPS) and the join with the
# application's own request_id (see AttachLogContext). Honours a
# client-supplied X-Request-Id; mints nginx's own $request_id otherwise.
map $http_x_request_id $easypost_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

# Excludes the health-check path from the access log — hit on a
# schedule, not by users, and would otherwise dominate the RPS panel
# and make it meaningless. Keyed on $easypost_path (see below), not
# $uri directly: by the time access_log's `if=` is evaluated (the log
# phase, at the very end of the request), try_files has already
# rewritten $uri to /index.php for every PHP request, so a map keyed
# on $uri here would never match /up at all — proven wrong against the
# real running stack before landing (see LOG_PLAN.md Phase 2 notes). A
# separate `location = /up` block was tried first and rejected: it
# intercepts the request before try_files/PHP, breaking the health
# check itself (404 instead of Laravel's real response).
map $easypost_path $easypost_loggable {
    /up     0;
    default 1;
}

log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$easypost_path",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$easypost_request_id",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    # Review finding 3 (Important): nginx's 1 MB default silently 413s
    # any upload above it with an opaque HTML error page, before the
    # request ever reaches PHP/Laravel's own validation — verified
    # against the running stack (a 2 MB POST to /api/media returned a
    # bare 413, not JSON). Set to 108M -- matching php.ini's
    # post_max_size, NOT the 100M file-only cap
    # (config('media.import_max_bytes') / UploadMediaRequest's `max`
    # rule) -- deliberately: nginx counts the WHOLE multipart request
    # body (file + every other field + multipart boundaries), so a file
    # within a few hundred bytes of the 100M file cap would still trip
    # nginx's limit first if it were also set to exactly 100M, producing
    # the same opaque HTML 413 this fix exists to eliminate. Laravel's
    # own `max` rule (a clean JSON 422) must always be the binding
    # constraint on file size, never nginx.
    client_max_body_size 108M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # LOG_PLAN.md Phase 2 — requirement 3. To stdout, JSON, one line per
    # request; the container runtime captures it same as the app logs.
    access_log /dev/stdout json_combined if=$easypost_loggable;

    location / {
        # Captured before try_files's internal redirect rewrites $uri
        # to /index.php for every PHP request — a server-level `set`
        # was tried first and rejected: try_files's internal redirect
        # re-enters the server rewrite phase, so a server-level `set`
        # fires AGAIN for the redirected sub-request and overwrites
        # this with /index.php anyway. Proven wrong against the real
        # running stack before landing here (see LOG_PLAN.md Phase 2
        # notes). This location runs exactly once, for the client's
        # original request, before that redirect ever happens.
        set $easypost_path $uri;

        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Joins this access line to the application's own log lines —
        # see App\Http\Middleware\AttachLogContext, which reads this
        # same header value back out of the request.
        fastcgi_param HTTP_X_REQUEST_ID $easypost_request_id;

        # Pass an upload straight through to php-fpm instead of spooling it in
        # nginx first. With buffering on, the body accumulated in this container
        # and the OOM killer took nginx down at ~64 MiB (exit 137), the size of
        # its mem_limit: one legal 99 MiB upload then dropped the whole web tier
        # (found by the first rehearsal). php-fpm writes it to its own temp file
        # in the container that is sized for it. client_max_body_size above still
        # applies, mid-stream.
        fastcgi_request_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
