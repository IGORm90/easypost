server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Review finding 3 (Important): nginx's 1 MB default silently 413s
    # any upload above it with an opaque HTML error page, before the
    # request ever reaches PHP/Laravel's own validation — verified
    # against the running stack (a 2 MB POST to /api/media returned a
    # bare 413, not JSON). Set to 108M -- matching php.ini's
    # post_max_size, NOT the 100M file-only cap
    # (config('media.import_max_bytes') / UploadMediaRequest's `max`
    # rule) -- deliberately: nginx counts the WHOLE multipart request
    # body (file + every other field + multipart boundaries), so a file
    # within a few hundred bytes of the 100M file cap would still trip
    # nginx's limit first if it were also set to exactly 100M, producing
    # the same opaque HTML 413 this fix exists to eliminate. Laravel's
    # own `max` rule (a clean JSON 422) must always be the binding
    # constraint on file size, never nginx.
    client_max_body_size 108M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
