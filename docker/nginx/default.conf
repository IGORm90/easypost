server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Review finding 3 (Important): nginx's 1 MB default silently 413s
    # any upload above it with an opaque HTML error page, before the
    # request ever reaches PHP/Laravel's own validation — verified
    # against the running stack (a 2 MB POST to /api/media returned a
    # bare 413, not JSON). Raised to match the 100 MB ceiling
    # config('media.import_max_bytes') and UploadMediaRequest's `max`
    # rule already enforce, so a within-limit upload never gets stopped
    # here first.
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
